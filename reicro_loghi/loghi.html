<!doctype html><html><head><meta charset="utf-8"><title>Loghi REICRO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap">
<style>
:root{--deep:#0E4F5C;--teal:#1C9C8C;--coral:#E8664A;--ink:#12303A;--muted:#5D7A80}
body{margin:0;background:#fff;font-family:Manrope,sans-serif}
.logo{display:inline-block;padding:40px;background:transparent}
.word{font:800 92px Manrope;letter-spacing:4px;fill:var(--ink)}
.sub{font:600 21px Manrope;letter-spacing:3.2px;fill:var(--muted)}
</style></head><body>

<!-- 1. RETE: nodi del territorio collegati attorno al paziente -->
<div class="logo" id="logo1"><svg width="760" height="220" viewBox="0 0 760 220">
 <g transform="translate(110,110)" stroke-linecap="round">
  <g stroke="#1C9C8C" stroke-width="5" fill="none" opacity=".55">
   <path d="M0,-88 L76,-44 L76,44 L0,88 L-76,44 L-76,-44 Z"/>
  </g>
  <g stroke="#1C9C8C" stroke-width="4" opacity=".35">
   <line x1="0" y1="-88" x2="0" y2="-40"/><line x1="76" y1="-44" x2="34" y2="-20"/><line x1="76" y1="44" x2="38" y2="22"/>
   <line x1="0" y1="88" x2="0" y2="44"/><line x1="-76" y1="44" x2="-38" y2="22"/><line x1="-76" y1="-44" x2="-34" y2="-20"/>
  </g>
  <g fill="#0E4F5C"><circle cx="0" cy="-88" r="13"/><circle cx="76" cy="-44" r="13"/><circle cx="-76" cy="44" r="13"/><circle cx="-76" cy="-44" r="13"/><circle cx="0" cy="88" r="13"/></g>
  <circle cx="76" cy="44" r="17" fill="#E8664A"/><path d="M76,35v18M67,44h18" stroke="#fff" stroke-width="5"/>
  <circle cx="0" cy="-14" r="15" fill="#E8664A"/>
  <path d="M-30,34 a30,30 0 0 1 60,0 z" fill="#E8664A"/>
 </g>
 <text class="word" x="250" y="118">REICRO</text>
 <text class="sub" x="254" y="162">RETE INTEGRATA CRONICITÀ</text>
</svg></div>

<!-- 2. PONTE: dalla casa all'ospedale, con il paziente al centro -->
<div class="logo" id="logo2"><svg width="760" height="220" viewBox="0 0 760 220">
 <g transform="translate(20,20)">
  <path d="M50,82 C80,20 140,20 172,82" fill="none" stroke="#1C9C8C" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 16"/>
  <path d="M2,112 L34,82 L66,112 L60,112 L60,150 L8,150 L8,112 Z" fill="#0E4F5C"/>
  <rect x="26" y="124" width="16" height="26" rx="2" fill="#fff"/>
  <rect x="162" y="96" width="56" height="54" rx="6" fill="#0E4F5C"/>
  <path d="M190,108v30M175,123h30" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M110,92 c-10,-16 -34,-8 -26,10 c5,11 26,24 26,24 c0,0 21,-13 26,-24 c8,-18 -16,-26 -26,-10 z" fill="#E8664A"/>
  <line x1="0" y1="168" x2="226" y2="168" stroke="#0E4F5C" stroke-width="4" stroke-linecap="round" opacity=".3"/>
 </g>
 <text class="word" x="280" y="118"><tspan fill="#0E4F5C">RE</tspan><tspan fill="#1C9C8C">I</tspan><tspan fill="#0E4F5C">CRO</tspan></text>
 <text class="sub" x="284" y="162">DAL TERRITORIO ALL'OSPEDALE</text>
</svg></div>

<!-- 3. CURA: due archi che accolgono la persona, anello di continuità -->
<div class="logo" id="logo3"><svg width="760" height="220" viewBox="0 0 760 220">
 <g transform="translate(110,110)" fill="none" stroke-linecap="round">
  <path d="M-62,-62 A88,88 0 0 0 62,62" stroke="#1C9C8C" stroke-width="16"/>
  <path d="M62,62 A88,88 0 0 0 -62,-62" stroke="#0E4F5C" stroke-width="16" stroke-dasharray="0 0"/>
  <circle cx="-62" cy="-62" r="10" fill="#fff" stroke="#E8664A" stroke-width="6"/>
  <circle cx="62" cy="62" r="10" fill="#fff" stroke="#E8664A" stroke-width="6"/>
  <circle cx="0" cy="-20" r="17" fill="#E8664A" stroke="none"/>
  <path d="M-32,36 a32,32 0 0 1 64,0" stroke="#E8664A" stroke-width="16"/>
 </g>
 <text class="word" x="250" y="118">REICRO</text>
 <text class="sub" x="254" y="162">PRESA IN CURA DI PROSSIMITÀ</text>
</svg></div>
</body></html>
