<!doctype html><html lang="it"><head><meta charset="utf-8"><title>La bilancia del benessere</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--ink:#0b171d;--ink-2:#13252d;--paper:#f3ece6;--muted:#9fb2b6;--line:#2a434d;--metal:#8fa3a8;--well:#6cc3a8;}
html,body{margin:0;background:var(--ink)}canvas{display:block;width:100%;max-width:1920px;aspect-ratio:16/9}
</style></head><body>
<canvas id="stage" width="1920" height="1080" aria-label="Animazione: una bilancia a due piatti; da un lato il peso corporeo, dall'altro entrano sonno, alimentazione, attività fisica, malattie, umore e relazioni, che fanno pendere la bilancia."></canvas>
<script>
(()=>{
['700 40px "Familjen Grotesk"','500 40px "Familjen Grotesk"','400 40px "IBM Plex Sans"','500 40px "IBM Plex Sans"','500 40px "IBM Plex Mono"'].forEach(f=>document.fonts.load(f));
const W=1920,H=1080,DUR=25;
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
const C={ink:v('--ink'),ink2:v('--ink-2'),paper:v('--paper'),muted:v('--muted'),line:v('--line'),metal:v('--metal'),well:v('--well')};
const FD='"Familjen Grotesk",Arial,sans-serif',FB='"IBM Plex Sans",Arial,sans-serif',FM='"IBM Plex Mono",monospace';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,eo=k=>1-Math.pow(1-k,3),ei=k=>k*k;
const fade=(t,a,b,c,d)=>Math.min(eo(seg(t,a,b)),d===undefined?1:1-eio(seg(t,c,d)));
function text(s,x,y,{w=500,f=FB,size,color=C.paper,align='left',alpha=1}){
  if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${w} ${size}px ${f}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.restore();}

// ---------- geometria ----------
const PX=960,PY=250,HALF=520,CHAIN=300,BASE=770,DEG=Math.PI/180;
const R=46; // raggio dei simboli
const SLOTS=[[-98,-R],[0,-R],[98,-R],[-49,-R-80],[49,-R-80],[0,-R-160]];

// ---------- determinanti ----------
const DET=[
 {name:'Sonno',col:'#7c8fd6',ic:'moon'},
 {name:'Alimentazione',col:'#5fb98f',ic:'apple'},
 {name:'Attività fisica',col:'#c8424f',ic:'dumb'},
 {name:'Malattie',col:'#e07a5f',ic:'heart'},
 {name:'Umore',col:'#e9b949',ic:'smile'},
 {name:'Relazioni',col:'#a985d1',ic:'people'},
];
const T0=5.2,STEP=1.55,FLY=1.15;
DET.forEach((d,i)=>{d.t0=T0+i*STEP;d.t1=d.t0+FLY;});
const TW=2.0; // atterraggio del peso

// angolo del giogo: somma di risposte smorzate (deterministico)
const EV=[{t:TW,d:-14},...DET.map(d=>({t:d.t1,d:28/6}))];
function beamAngle(t){let a=0;for(const e of EV){if(t<e.t)continue;const s=t-e.t,tau=.5,om=6.5;
  a+=e.d*(1-Math.exp(-s/tau)*(Math.cos(om*s)+Math.sin(om*s)/(om*tau)));}return a*DEG;}
function ends(t){const a=beamAngle(t),c=Math.cos(a),s=Math.sin(a);
  return {a,L:{x:PX-HALF*c,y:PY-HALF*s},R:{x:PX+HALF*c,y:PY+HALF*s}};}

// ---------- icone ----------
function icon(d,x,y,r,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);const k=r/46;ctx.scale(k,k);
  ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fillStyle=d.col;ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();
  ctx.fillStyle=C.paper;ctx.strokeStyle=C.paper;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
  switch(d.ic){
   case 'moon':ctx.beginPath();ctx.arc(-4,4,22,0,7);ctx.fill();ctx.beginPath();ctx.arc(8,-6,20,0,7);ctx.fillStyle=d.col;ctx.fill();
     ctx.font=`700 16px ${FD}`;ctx.fillStyle=C.paper;ctx.fillText('z',14,-16);ctx.font=`700 12px ${FD}`;ctx.fillText('z',24,-26);break;
   case 'apple':ctx.beginPath();ctx.moveTo(0,-10);ctx.bezierCurveTo(-14,-22,-32,-10,-26,8);ctx.bezierCurveTo(-22,22,-10,28,0,22);
     ctx.bezierCurveTo(10,28,22,22,26,8);ctx.bezierCurveTo(32,-10,14,-22,0,-10);ctx.fill();
     ctx.beginPath();ctx.moveTo(0,-10);ctx.quadraticCurveTo(2,-20,6,-26);ctx.stroke();
     ctx.beginPath();ctx.ellipse(13,-22,8,4,-.5,0,7);ctx.fill();break;
   case 'dumb':ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.lineWidth=6;ctx.stroke();
     [[-26,12,30],[-34,8,20],[18,12,30],[28,8,20]].forEach(([x0,w,h])=>{ctx.beginPath();ctx.roundRect(x0,-h/2,w-2,h,3);ctx.fill();});break;
   case 'heart':ctx.beginPath();ctx.moveTo(0,24);ctx.bezierCurveTo(-30,4,-30,-24,-12,-24);ctx.bezierCurveTo(-4,-24,0,-18,0,-12);
     ctx.bezierCurveTo(0,-18,4,-24,12,-24);ctx.bezierCurveTo(30,-24,30,4,0,24);ctx.fill();
     ctx.beginPath();ctx.moveTo(-22,-2);ctx.lineTo(-8,-2);ctx.lineTo(-3,-12);ctx.lineTo(3,8);ctx.lineTo(8,-2);ctx.lineTo(22,-2);ctx.strokeStyle=d.col;ctx.lineWidth=4;ctx.stroke();break;
   case 'smile':ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.stroke();ctx.beginPath();ctx.arc(-9,-7,3.5,0,7);ctx.arc(9,-7,3.5,0,7);ctx.fill();
     ctx.beginPath();ctx.arc(0,2,14,.2*Math.PI,.8*Math.PI);ctx.stroke();break;
   case 'people':[[-12,0],[13,4]].forEach(([dx,dy],j)=>{ctx.beginPath();ctx.arc(dx,-12+dy,9-j,0,7);ctx.fill();
     ctx.beginPath();ctx.arc(dx,22+dy,18-j*2,Math.PI,0);ctx.fill();});break;
  }
  ctx.restore();}

// ---------- parti della bilancia ----------
function pan(x,y,alpha){ // x,y = punto di aggancio sul giogo; ritorna centro del piatto
  const py=y+CHAIN;ctx.save();ctx.globalAlpha*=alpha;
  ctx.strokeStyle=C.metal;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-190,py);ctx.lineTo(x,y);ctx.lineTo(x+190,py);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-210,py);ctx.quadraticCurveTo(x,py+70,x+210,py);ctx.closePath();
  const g=ctx.createLinearGradient(0,py,0,py+40);g.addColorStop(0,'#b6c4c7');g.addColorStop(1,'#5d7176');ctx.fillStyle=g;ctx.fill();
  ctx.restore();return {x,y:py};}

function weight(x,y,alpha){ // base del peso in (x,y)
  if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;
  ctx.beginPath();ctx.moveTo(x-110,y);ctx.lineTo(x-78,y-150);ctx.lineTo(x+78,y-150);ctx.lineTo(x+110,y);ctx.closePath();
  const g=ctx.createLinearGradient(x-110,0,x+110,0);g.addColorStop(0,'#3a4a50');g.addColorStop(.45,'#6e8186');g.addColorStop(1,'#2c3a3f');ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.roundRect(x-30,y-186,60,40,18);ctx.lineWidth=12;ctx.strokeStyle='#55686d';ctx.stroke();
  text('kg',x,y-52,{w:500,f:FM,size:64,align:'center'});
  ctx.restore();}

function render(t){
  ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  const gl=ctx.createRadialGradient(W/2,H*.45,50,W/2,H*.45,1100);gl.addColorStop(0,'rgba(108,195,168,.07)');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  const hd=fade(t,.2,1);
  text('LA BILANCIA DEL BENESSERE',80,92,{w:500,f:FD,size:30,color:C.muted,alpha:hd});
  ctx.fillStyle=C.well;ctx.globalAlpha=hd;ctx.fillRect(80,108,90*eo(seg(t,.3,1.3)),4);ctx.globalAlpha=1;

  const sc=eo(seg(t,.3,1.4)),fin=0;
  ctx.save();
  // nella chiusura la bilancia si rimpicciolisce e sale
  ctx.translate(W/2,0);ctx.scale(1-.22*fin,1-.22*fin);ctx.translate(-W/2,-40*fin);
  ctx.globalAlpha=sc;
  // base e colonna
  ctx.fillStyle='#5d7176';ctx.beginPath();ctx.roundRect(PX-150,BASE,300,26,13);ctx.fill();
  ctx.beginPath();ctx.moveTo(PX-60,BASE);ctx.lineTo(PX-18,BASE-40);ctx.lineTo(PX+18,BASE-40);ctx.lineTo(PX+60,BASE);ctx.fill();
  ctx.fillStyle='#7d9095';ctx.fillRect(PX-10,PY,20,BASE-40-PY);
  const E=ends(t);
  // giogo
  ctx.save();ctx.translate(PX,PY);ctx.rotate(E.a);
  const g=ctx.createLinearGradient(0,-10,0,10);g.addColorStop(0,'#c3d0d3');g.addColorStop(1,'#6b7f84');ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(-HALF-14,-9,2*HALF+28,18,9);ctx.fill();
  ctx.fillStyle='#c3d0d3';[-HALF,HALF].forEach(x=>{ctx.beginPath();ctx.arc(x,0,13,0,7);ctx.fill();});
  // ago
  ctx.fillStyle=C.well;ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(0,-70);ctx.lineTo(7,-8);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#dfe7e8';ctx.beginPath();ctx.arc(PX,PY,16,0,7);ctx.fill();
  // scala dell'ago
  ctx.strokeStyle=C.line;ctx.lineWidth=3;ctx.beginPath();ctx.arc(PX,PY,82,-Math.PI/2-.45,-Math.PI/2+.45);ctx.stroke();

  // piatto sinistro: il peso
  const pl=pan(E.L.x,E.L.y,1);
  const wk=seg(t,1.3,TW),wy=lerp(-260,pl.y-2,ei(wk));
  weight(pl.x,wk<1?wy:pl.y-2,eo(seg(t,1.3,1.6)));
  // piatto destro: i determinanti
  const pr=pan(E.R.x,E.R.y,1);
  ctx.restore();
  const S=1-.22*fin, toScreen=(x,y)=>({x:W/2+(x-W/2)*S,y:(y-40*fin)*S});
  DET.forEach((d,i)=>{
    if(t<d.t0)return;
    const [sx,sy]=SLOTS[i],tgt=toScreen(pr.x+sx,pr.y+sy);
    const k=seg(t,d.t0,d.t1),e=eio(k);
    const st={x:W+120,y:170};
    let x=lerp(st.x,tgt.x,e),y=lerp(st.y,tgt.y,e)-Math.sin(Math.PI*e)*120;
    const r=lerp(78,R*S,eio(seg(t,d.t0+.5,d.t1)));
    icon(d,x,y,r);
    // nome del determinante
    const la=fade(t,d.t0,d.t0+.35,d.t0+STEP-.15,d.t0+STEP+.15);
    if(i===DET.length-1){const la2=fade(t,d.t0,d.t0+.35,16.0,16.5);text('+ '+d.name,W/2,930,{w:700,f:FD,size:64,color:d.col,align:'center',alpha:la2});}
    else text('+ '+d.name,W/2,930,{w:700,f:FD,size:64,color:d.col,align:'center',alpha:la});
  });

  // didascalie
  text('Spesso guardiamo solo il peso.',W/2,930,{w:700,f:FD,size:64,align:'center',alpha:fade(t,2.3,3.0,4.8,5.3)});
  text('Il benessere ha molti determinanti.',W/2,930,{w:700,f:FD,size:64,align:'center',alpha:fade(t,16.4,17.1,18.3,18.8)});
  // chiusura
  const e1=eo(seg(t,19.6,20.6)),e2=eo(seg(t,20.6,21.6));
  text('Non guardare solo il peso:',W/2,895,{w:700,f:FD,size:66,align:'center',alpha:e1});
  text('guarda a tutti i determinanti del benessere.',W/2,985,{w:700,f:FD,size:66,color:C.well,align:'center',alpha:e2});
}
window.renderAt=render;window.DURATION=DUR;
if(!location.search.includes('record')){const t0=performance.now();const loop=n=>{render(((n-t0)/1000)%DUR);requestAnimationFrame(loop)};document.fonts.ready.then(()=>requestAnimationFrame(loop));}
else render(0);
})();
</script></body></html>
